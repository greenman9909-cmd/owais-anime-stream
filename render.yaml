services:
  - type: web
    name: reanime-api
    runtime: python
    plan: free
    buildCommand: |
      pip install -r requirements.txt
      cd node && npm install
    startCommand: uvicorn reanime:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: NODE_VERSION
        value: 20.0.0
      - key: FRONTEND_ORIGIN
        value: https://owais-anime-stream.onrender.com
    healthCheckPath: /health
