<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#05070b">
  <title>OWAIS Anime</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="appShell">
    <header class="topbar">
      <button class="brand" data-action="nav-home" aria-label="Home">
        <span class="brand-moon"><span class="brand-play"></span></span>
        <span class="brand-copy"><b>OWAIS</b><small>ANIME</small></span>
      </button>
      <button id="serverChip" class="server-chip" data-action="server-settings">
        <span id="serverDot"></span>
        <span id="serverText">Connecting</span>
      </button>
    </header>

    <main id="view" class="view"></main>

    <nav id="bottomNav" class="bottom-nav">
      <button class="nav-item active" data-action="nav-home">
        <span class="nav-icon">⌂</span><span>Home</span>
      </button>
      <button class="nav-item" data-action="nav-search">
        <span class="nav-icon">⌕</span><span>Search</span>
      </button>
      <button class="nav-item" data-action="nav-library">
        <span class="nav-icon">♡</span><span>My List</span>
      </button>
    </nav>
  </div>

  <section id="playerScreen" class="player-screen hidden">
    <div class="player-topbar">
      <button class="round-btn" data-action="close-player">←</button>
      <div class="player-title-wrap">
        <b id="playerTitle">Now Playing</b>
        <span id="playerSubtitle">Episode 1</span>
      </div>
      <button class="round-btn" data-action="toggle-track">SUB</button>
    </div>

    <div class="player-frame-wrap">
      <iframe
        id="playerFrame"
        title="OWAIS Anime Player"
        allow="autoplay; fullscreen; picture-in-picture"
        allowfullscreen></iframe>
      <div id="playerLoading" class="player-loading">
        <div class="spinner"></div>
        <b>Loading episode</b>
        <span>The Render service may need a moment to wake.</span>
      </div>
    </div>

    <div class="player-meta">
      <div>
        <span class="eyebrow">NOW PLAYING</span>
        <h2 id="playerMetaTitle">Anime</h2>
        <p id="playerMetaEpisode">Episode 1</p>
      </div>
      <div class="episode-stepper">
        <button data-action="prev-episode">−</button>
        <b id="episodeNumber">1</b>
        <button data-action="next-episode">+</button>
      </div>
    </div>
  </section>

  <div id="toast" class="toast"></div>
  <script src="app.js"></script>
</body>
</html>
