name: Build OWAIS Anime APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "third_party/slopmonster/**"
      - ".github/workflows/build-android-apk.yml"

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.9"

      - name: Check bundled app JavaScript
        run: node --check android/app/src/main/assets/app/app.js

      - name: Verify v6 UI marker
        run: |
          grep -q "v6.0" android/app/src/main/assets/app/index.html
          grep -q "Browse anime" android/app/src/main/assets/app/app.js
          grep -q "Popular This Week" android/app/src/main/assets/app/app.js

      - name: SlopMonster regression tests
        run: python3 third_party/slopmonster/test_deslop.py

      - name: Lint visible APK copy with SlopMonster
        run: python3 third_party/slopmonster/deslop.py android/app/src/main/assets/app/index.html --allow-proof

      - name: Build debug APK
        run: gradle -p android assembleDebug --no-daemon

      - name: Publish versioned APK to repository root
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git reset --hard origin/main
          cp android/app/build/outputs/apk/debug/app-debug.apk OWAIS-Anime-v6.apk
          git add OWAIS-Anime-v6.apk
          if git diff --cached --quiet; then
            echo "APK unchanged"
          else
            git commit -m "build: publish OWAIS Anime v6 APK"
            git push origin main
          fi

      - name: Publish OWAIS Anime v6 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v6-apk >/dev/null 2>&1; then
            gh release upload v6-apk OWAIS-Anime-v6.apk --clobber
          else
            gh release create v6-apk OWAIS-Anime-v6.apk               --title "OWAIS Anime v6 Android"               --notes "OWAIS Anime v6.0.0 — redesigned Android UI with native Media3 playback and on-device localhost backend."
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v6
        with:
          name: OWAIS-Anime-v6-Android
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
