name: Build OWAIS Anime APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/build-android-apk.yml"

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Check bundled app JavaScript
        run: node --check android/app/src/main/assets/app/app.js

      - name: Build debug APK
        run: gradle -p android assembleDebug --no-daemon

      - name: Publish APK to repository root
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk OWAIS-Anime.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add OWAIS-Anime.apk
          if git diff --cached --quiet; then
            echo "APK unchanged"
          else
            git commit -m "build: publish OWAIS Anime APK"
            git push
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: OWAIS-Anime-Android
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
